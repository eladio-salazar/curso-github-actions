name: Hola mundo workflow
on: [push]

jobs:
  ejecutar_main:
    name: Ejecutar main
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/Checkout@v3
      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Ejecutar main
        run: python3 main.py